name: FoodLoop CI & DSA Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-and-build:
    name: Automated DSA Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install

      - name: Run 14-Module DSA Test Harness
        run: |
          cd server
          npm test

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci || npm install

      - name: Verify Frontend Production Build
        run: |
          cd client
          npm run build

